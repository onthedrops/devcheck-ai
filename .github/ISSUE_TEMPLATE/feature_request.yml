name: Feature request
title: "[Feature] "
description: Suggest a new SDK to cover or a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: A new SDK, a new auto-fix rule, a new ecosystem, etc.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Why would this be useful? What problem does it solve?
    validations:
      required: true
