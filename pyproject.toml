[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devcheck-ai"
version = "0.1.0"
description = "Preflight dependency reality check for AI-generated code. Detects stale libraries, version drift, and deprecated packages before you ship."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Open Source Contributors"},
]
keywords = ["dependencies", "version-drift", "ai-code", "preflight", "stale", "deprecated", "pypi", "npm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "packaging>=23.0",
    "requests>=2.28",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[project.scripts]
devcheck-ai = "devcheck_ai.cli:main"

[project.urls]
Homepage = "https://github.com/devcheck-ai/devcheck-ai"
Issues = "https://github.com/devcheck-ai/devcheck-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devcheck_ai = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
