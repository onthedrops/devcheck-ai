[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devcheck-ai"
version = "0.1.0"
description = "Preflight dependency reality check for AI-generated code. Detects stale libraries, version drift, and deprecated packages before you ship."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "onthedrops"},
]
keywords = ["dependencies", "version-drift", "ai-code", "preflight", "stale", "deprecated", "pypi", "npm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "packaging>=23.0",
    "requests>=2.28",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
]

[project.scripts]
devcheck-ai = "devcheck_ai.cli:main"

[project.urls]
Homepage = "https://github.com/onthedrops/devcheck-ai"
Issues = "https://github.com/onthedrops/devcheck-ai/issues"
Repository = "https://github.com/onthedrops/devcheck-ai"
Changelog = "https://github.com/onthedrops/devcheck-ai/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devcheck_ai = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 140
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "PERF"]
ignore = [
    "UP045",   # Optional[X] needed for Python 3.9 compatibility
    "BLE001",  # blind except is intentional in smoke tests
    "PLW1510", # subprocess.run without check is intentional
    "DTZ005",  # datetime.now() without tz is fine for timestamping
    "SIM102",  # nested if is more readable in some cases
    "SIM116",  # dict-instead-of-if is less readable for client init
    "SIM108",  # ternary instead of if-else is less readable
    "ISC004",  # implicit string concat in collections
    "E501",    # line length — migration notes are long strings
    "PERF102", # .items() → .values() loses key context in reports
    "PERF401", # list.extend over list.append is less readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F821",   # undefined names in deprecated code fixtures
    "F841",   # unused vars in test fixtures
    "F401",   # unused imports in deprecated code fixtures
    "E402",   # import order in test fixtures
    "F704",   # await outside function in async fixtures
    "PLE1142",# await outside async in fixtures
]
"tests/fixtures/**" = ["ALL"]  # deprecated code patterns — do not lint
"tests/test_autofix.py" = ["ALL"]  # contains deprecated code patterns

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["test_*"]
