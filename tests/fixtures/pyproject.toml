[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "test-ai-project"
version = "0.1.0"
dependencies = [
    "openai>=1.0.0",
    "anthropic~=0.20.0",
    "fastapi==0.104.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]
